goal: >
  On Windows `python3` is often the Microsoft Store stub, so the README's
  setup fails there. Under "## Commands", after the macOS/Linux alias, add an
  "#### On Windows" part that sets crowd up with the py launcher in
  PowerShell (`function crowd { py -3 $HOME\crowd\cli\crowd.py @args }`) and
  says in one line why. In the "I want to help a project" prompt, step 2
  becomes "Check I have python3 (on Windows: `py -3`), git, gh and pyyaml."
  Keep it short; no other README changes.

interface:
  file: README.md
  signature: |
    ## Commands
      ... existing alias block, unchanged ...
      #### On Windows        <- new; uses `py -3` and crowd.py, never `python3 `
    Start-here prompt step 2 mentions `py -3`.

